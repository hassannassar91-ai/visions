# Deploy: Render Dashboard → New → Blueprint → connect this repo.
# Custom domain: droobtech.sa (DNS configured in Sahara Net panel).

services:
  - type: web
    runtime: python
    name: droobtech-web
    plan: starter
    buildCommand: bash build.sh
    startCommand: gunicorn hasan_test.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    domains:
      - droobtech.sa
      - www.droobtech.sa
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NODE_VERSION
        value: 22.12.0
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: droobtech-web.onrender.com,droobtech.sa,www.droobtech.sa
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://droobtech-web.onrender.com,https://droobtech.sa,https://www.droobtech.sa
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: droobtech-db
          property: connectionString

databases:
  - name: droobtech-db
    plan: free
