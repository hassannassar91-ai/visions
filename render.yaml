# Deploy: Render Dashboard → New → Blueprint → connect this repo.
# Custom domain: visions-tek.com (DNS at GoDaddy must match Render’s instructions).

services:
  - type: web
    runtime: python
    name: visions-tek-web
    plan: starter
    buildCommand: bash build.sh
    startCommand: gunicorn hasan_test.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    domains:
      - visions-tek.com
      - www.visions-tek.com
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: visions-tek-web.onrender.com,visions-tek.com,www.visions-tek.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://visions-tek-web.onrender.com,https://visions-tek.com,https://www.visions-tek.com
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: visions-db
          property: connectionString

databases:
  - name: visions-db
    plan: free
